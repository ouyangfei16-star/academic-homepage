<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <section class="card intro-card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-2">
                    <div class="col">
                        <p class="section-eyebrow mb-2">在路上，也在记录</p>
                        <h1 class="h2 mb-0">
                            关于我
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ site.data.profile.short_bio }}
                        </div>
                        {% if site.data.profile.cv_link %}
                            <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> 个人简历</a> <br/>
                        {% endif %}
                    </div>
        
                </div>
            </div>
        </section>
    </div>
</div>
